<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="1200" height="48" role="img" aria-label="Section divider">
  <title>Section divider</title>
  <defs>
    <linearGradient id="gitFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="10%" stop-color="#7aa2f7" stop-opacity="0.95"/>
      <stop offset="48%" stop-color="#bb9af7" stop-opacity="0.95"/>
      <stop offset="88%" stop-color="#2ac3de" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2ac3de" stop-opacity="0"/>
    </linearGradient>
    <filter id="gitGlow" filterUnits="userSpaceOnUse" x="-40" y="-20" width="1280" height="88">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- faint permanent trace, so the rule still reads when the animation clears -->
  <g fill="none" stroke="url(#gitFade)" stroke-width="1.5" opacity="0.15">
    <path d="M0,24 H1200"/>
    <path d="M250,24 C275,24 275,9 300,9 H440 C465,9 465,24 490,24"/>
    <path d="M700,24 C725,24 725,39 750,39 H890 C915,39 915,24 940,24"/>
  </g>

  <!-- history writing itself, left to right -->
  <path d="M0,24 H1200" fill="none" stroke="url(#gitFade)" stroke-width="2.2"
        stroke-linecap="round" opacity="1" filter="url(#gitGlow)"
        stroke-dasharray="1200" stroke-dashoffset="1200">
    <animate attributeName="stroke-dashoffset" values="1200;1200;0;0;-1200"
             keyTimes="0;0;0.44;0.78;1" dur="6.0s"
             repeatCount="indefinite" calcMode="spline"
             keySplines="0 0 1 1;.25 .6 .35 1;0 0 1 1;.5 0 .5 1"/>
  </path>
  <path d="M250,24 C275,24 275,9 300,9 H440 C465,9 465,24 490,24" fill="none" stroke="url(#gitFade)" stroke-width="2.0"
        stroke-linecap="round" opacity="0.95" filter="url(#gitGlow)"
        stroke-dasharray="247" stroke-dashoffset="247">
    <animate attributeName="stroke-dashoffset" values="247;247;0;0;-247"
             keyTimes="0;0.0917;0.1797;0.78;1" dur="6.0s"
             repeatCount="indefinite" calcMode="spline"
             keySplines="0 0 1 1;.25 .6 .35 1;0 0 1 1;.5 0 .5 1"/>
  </path>
  <path d="M700,24 C725,24 725,39 750,39 H890 C915,39 915,24 940,24" fill="none" stroke="url(#gitFade)" stroke-width="2.0"
        stroke-linecap="round" opacity="0.95" filter="url(#gitGlow)"
        stroke-dasharray="247" stroke-dashoffset="247">
    <animate attributeName="stroke-dashoffset" values="247;247;0;0;-247"
             keyTimes="0;0.2567;0.3447;0.78;1" dur="6.0s"
             repeatCount="indefinite" calcMode="spline"
             keySplines="0 0 1 1;.25 .6 .35 1;0 0 1 1;.5 0 .5 1"/>
  </path>

  <!-- commits -->
